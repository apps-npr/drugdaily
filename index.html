<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อรับยาประจำวัน</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="neo-header">
        <h1 id="currentDate">กำลังโหลดวันที่...</h1>
    </header>

    <main>
        <section id="setupSection" class="neo-card text-center">
            <h2 class="title-text">เลือกเภสัชกรผู้ปฏิบัติงาน</h2>
            <select id="pharmacistSelect" class="neo-input">
                <option value="">-- กรุณาเลือกชื่อ --</option>
            </select>
            <div class="btn-group">
                <button id="startShiftBtn" class="neo-btn primary">เริ่มการทำงาน</button>
                <button id="showLoginBtn" class="neo-btn">สถิติ (Admin)</button>
            </div>
        </section>

        <section id="workSection" class="hidden">
            <div class="action-bar neo-card">
                <button id="endShiftBtn" class="neo-btn danger">จบการทำงานและบันทึก</button>
            </div>
            
            <div class="neo-card">
                <h2 class="title-text text-center">รายชื่อหอผู้ป่วยรับยา</h2>
                <div id="wardGrid" class="ward-grid"></div>
            </div>
            <p id="syncStatus" class="status-text"></p>
        </section>

        <section id="loginSection" class="hidden neo-card text-center">
            <h2 class="title-text">เข้าสู่ระบบ Admin</h2>
            <input type="password" id="adminPass" class="neo-input" placeholder="ใส่รหัสผ่าน">
            <div class="btn-group">
                <button id="loginBtn" class="neo-btn primary">เข้าสู่ระบบ</button>
                <button id="cancelLoginBtn" class="neo-btn">ยกเลิก</button>
            </div>
            <p id="loginStatus" class="status-text"></p>
        </section>

        <section id="dashboardSection" class="hidden">
            <div class="neo-card header-dash">
                <h2 class="title-text">📊 Dashboard ข้อมูลปฏิบัติงาน</h2>
                <button id="closeDashBtn" class="neo-btn danger-text">ปิด</button>
            </div>
            
            <div class="neo-card filters">
                <select id="dashFilterTime" class="neo-input">
                    <option value="30">ย้อนหลัง 30 วัน</option>
                    <option value="90">ย้อนหลัง 90 วัน</option>
                    <option value="180">ย้อนหลัง 180 วัน</option>
                    <option value="365">ย้อนหลัง 1 ปี (365 วัน)</option>
                </select>
                <select id="dashFilterPharmacist" class="neo-input">
                    <option value="all">ดูทุกคน (ภาพรวม)</option>
                    </select>
            </div>

            <div id="personalStatsSection" class="neo-card hidden">
                <div class="stats-summary">
                    <div class="stat-box neo-inset">
                        <p class="stat-label">จำนวนเวรทั้งหมด</p>
                        <h3 id="statTotalShifts" class="stat-value primary-text">0</h3>
                    </div>
                    <div class="stat-box neo-inset">
                        <p class="stat-label">ระยะเวลาเฉลี่ย/เวร</p>
                        <h3 id="statAvgDuration" class="stat-value primary-text">0 ชม. 0 นาที</h3>
                    </div>
                </div>

                <h3 class="subtitle-text mt-20">ประวัติเวลาปฏิบัติงาน</h3>
                <div class="history-list neo-inset" id="shiftHistoryList">
                    </div>
            </div>

            <div id="wardStatsSection" class="neo-card">
                <h3 class="subtitle-text text-center">สถิติการมารับยาของ Ward</h3>
                <div class="z-pattern-grid mt-20">
                    <div class="neo-inset p-15">
                        <h4 class="success-text">🏆 ไวที่สุด (เฉลี่ย)</h4>
                        <ol id="fastestWardsList" class="ranking-list"></ol>
                    </div>
                    <div class="neo-inset p-15">
                        <h4 class="danger-text">🐢 ช้าที่สุด (เฉลี่ย)</h4>
                        <ol id="slowestWardsList" class="ranking-list"></ol>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="pharmacistBadge" class="neo-badge hidden"><span id="badgeName"></span></div>
    <script src="script.js"></script>
</body>
</html>

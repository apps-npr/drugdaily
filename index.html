<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อรับยาประจำวัน</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <header class="glass-header">
        <h1 id="currentDate">กำลังโหลดวันที่...</h1>
    </header>

    <main>
        <section id="setupSection" class="glass-card text-center">
            <h2 class="title-text">เลือกเภสัชกรผู้ปฏิบัติงาน</h2>
            <select id="pharmacistSelect" class="glass-input">
                <option value="">-- กรุณาเลือกชื่อ --</option>
            </select>
            <div class="btn-group">
                <button id="startShiftBtn" class="glass-btn primary">เริ่มการทำงาน</button>
                <button id="showLoginBtn" class="glass-btn outline">สถิติ (Admin)</button>
            </div>
        </section>

        <section id="workSection" class="hidden">
            <div class="glass-card action-bar">
                <button id="endShiftBtn" class="glass-btn danger">จบการทำงานและบันทึก</button>
            </div>
            
            <div class="glass-card">
                <h2 class="title-text text-center">รายชื่อหอผู้ป่วยรับยา</h2>
                <div id="wardGrid" class="ward-grid"></div>
            </div>
            <p id="syncStatus" class="status-text"></p>
        </section>

        <section id="loginSection" class="hidden glass-card text-center">
            <h2 class="title-text">เข้าสู่ระบบ Admin</h2>
            <input type="password" id="adminPass" class="glass-input text-center" placeholder="ใส่รหัสผ่าน">
            <div class="btn-group">
                <button id="loginBtn" class="glass-btn primary">เข้าสู่ระบบ</button>
                <button id="cancelLoginBtn" class="glass-btn outline">ยกเลิก</button>
            </div>
            <p id="loginStatus" class="status-text"></p>
        </section>

        <section id="dashboardSection" class="hidden glass-card">
            <div class="header-dash">
                <h2 class="title-text" style="margin:0;">📊 Dashboard</h2>
                <button id="closeDashBtn" class="glass-btn danger small-btn">ปิด</button>
            </div>
            
            <div class="filters">
                <select id="dashFilterTime" class="glass-input">
                    <option value="30">ย้อนหลัง 30 วัน</option>
                    <option value="90">ย้อนหลัง 90 วัน</option>
                    <option value="180">ย้อนหลัง 180 วัน</option>
                    <option value="365">ย้อนหลัง 1 ปี (365 วัน)</option>
                </select>
                <select id="dashFilterPharmacist" class="glass-input">
                    <option value="all">ดูทุกคน (ภาพรวม)</option>
                </select>
            </div>

            <div id="personalStatsSection" class="hidden">
                <div class="stats-summary">
                    <div class="stat-box glass-inner">
                        <p class="stat-label">จำนวนเวรทั้งหมด</p>
                        <h3 id="statTotalShifts" class="stat-value">0</h3>
                    </div>
                    <div class="stat-box glass-inner">
                        <p class="stat-label">ระยะเวลาเฉลี่ย/เวร</p>
                        <h3 id="statAvgDuration" class="stat-value">0 ชม. 0 นาที</h3>
                    </div>
                </div>
                <h3 class="subtitle-text mt-20">ประวัติเวลาปฏิบัติงาน</h3>
                <div class="history-list glass-inner" id="shiftHistoryList"></div>
            </div>

            <div id="wardStatsSection">
                <h3 class="subtitle-text text-center mt-20">สถิติการมารับยาของ Ward</h3>
                <div class="z-pattern-grid mt-20">
                    <div class="glass-inner p-15">
                        <h4 style="color:#059669; margin-top:0;">🏆 ไวที่สุด (เฉลี่ย)</h4>
                        <ol id="fastestWardsList" class="ranking-list"></ol>
                    </div>
                    <div class="glass-inner p-15">
                        <h4 style="color:#dc2626; margin-top:0;">🐢 ช้าที่สุด (เฉลี่ย)</h4>
                        <ol id="slowestWardsList" class="ranking-list"></ol>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="pharmacistBadge" class="glass-badge hidden"><span id="badgeName"></span></div>
    <script src="script.js"></script>
</body>
</html>
